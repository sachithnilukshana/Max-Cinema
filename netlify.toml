[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_CINESCOPE_API_URL,SUPABASE_URL,VITE_SUPABASE_URL"
  SECRETS_SCAN_OMIT_PATHS = "index.html,src/lib/cinescopeApi.js,server/index.mjs,netlify.toml"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self' https://cinescope-api-9ukz.onrender.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://login-6a0e1-default-rtdb.firebaseio.com https://login-6a0e1.firebaseapp.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://ihenxsggtzkhnqiepysd.supabase.co wss://ihenxsggtzkhnqiepysd.supabase.co; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'self'; frame-src 'self' https://login-6a0e1.firebaseapp.com https://www.youtube-nocookie.com https://embedmaster.link https://embedmaster.com https://embdmstrplayer.com https:; img-src 'self' https://image.tmdb.org https://cinescope-api-9ukz.onrender.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net data: https:; object-src 'none'; script-src 'self' https://cinescope-api-9ukz.onrender.com https://apis.google.com https://pagead2.googlesyndication.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
